<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE ACCESS | Biometria Facial</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body id="app-body">
    <div class="glass-background"></div>
    
    <header>
        <div class="logo">
            <i data-lucide="shield-check"></i>
            <span>FREE<strong>ACCESS</strong></span>
        </div>
        <div class="status-badge">
            <i data-lucide="circle-dot"></i>
            <span>Sistema Online</span>
        </div>
    </header>

    <main class="app-container">
        <!-- Visualização da Câmera - Sempre visível -->
        <section class="camera-section" id="camera-container">
            <video id="video-preview" autoplay playsinline muted></video>
            <div class="scan-overlay">
                <div class="scan-line"></div>
                <div class="face-rect" id="face-rect"></div>
            </div>
            
            <!-- Botão para alternar câmera (Mobile) -->
            <button id="btn-switch-camera" class="btn-icon-floating" title="Alternar Câmera">
                <i data-lucide="refresh-cw"></i>
            </button>

            <!-- Floating Result Indicator -->
            <div id="floating-status" class="floating-status">
                <div class="status-icon" id="status-icon-main">
                    <i data-lucide="lock"></i>
                </div>
            </div>
        </section>

        <!-- Painel de Controle com Abas -->
        <aside class="control-panel">
            
            <!-- ABA 1: ACESSO (PADRÃO) -->
            <div id="tab-access" class="tab-content active">
                <div class="card gate-card">
                    <div class="gate-status-container">
                        <div class="gate-visual" id="gate-visual">
                            <div class="gate-arm" id="gate-arm"></div>
                            <i data-lucide="lock" id="gate-icon"></i>
                        </div>
                        <div class="gate-label" id="gate-label">BLOQUEADA</div>
                        
                        <div id="gate-message" class="welcome-box" style="display: none;">
                            <div id="user-gender-icon" class="gender-emoji">🎩</div>
                            <div id="user-welcome-name" class="welcome-name">Olá!</div>
                            <div id="user-welcome-ticket" class="welcome-ticket">Ticket</div>
                        </div>
                    </div>
                </div>

                <div class="action-bar">
                    <button class="btn btn-primary btn-lg" id="btn-recognize">
                        <i data-lucide="scan-face"></i>
                        VERIFICAR ACESSO
                    </button>
                    
                    <div class="auto-scan-box">
                        <span>Reconhecimento Automático</span>
                        <label class="switch">
                            <input type="checkbox" id="auto-scan-toggle">
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>

                <div class="card history-card">
                    <h3><i data-lucide="history"></i> Últimos Acessos</h3>
                    <div id="access-history" class="history-list"></div>
                </div>
            </div>

            <!-- ABA 2: CADASTRO -->
            <div id="tab-register" class="tab-content">
                <div class="card">
                    <h3><i data-lucide="user-plus"></i> Novo Cadastro</h3>
                    <p class="instruction-text">Posicione o rosto no centro da câmera e preencha os dados abaixo.</p>
                    
                    <div class="form-group">
                        <label>Nome do Usuário</label>
                        <input type="text" id="user-name-input" placeholder="Ex: Claudemir Silva">
                    </div>

                    <div class="form-group">
                        <label>Gênero</label>
                        <div class="gender-selector">
                            <select id="user-gender-select">
                                <option value="auto">Detectar via IA</option>
                                <option value="Man">Masculino 🎩</option>
                                <option value="Woman">Feminino 👗</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn btn-success btn-lg" id="btn-register">
                        <i data-lucide="user-plus"></i>
                        FINALIZAR CADASTRO
                    </button>
                </div>
                
                <div class="card logs-card">
                    <h3><i data-lucide="activity"></i> Logs do Sistema</h3>
                    <div id="log-container" class="log-viewer">
                        <div>[INFO] Aguardando ação...</div>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Barra de Navegação Inferior (Estilo Mobile) -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="tab-access">
            <i data-lucide="door-open"></i>
            <span>Acesso</span>
        </button>
        <button class="nav-item" data-tab="tab-register">
            <i data-lucide="user-plus"></i>
            <span>Cadastrar</span>
        </button>
    </nav>

    <footer>
        <p>FREE ACCESS &copy; 2026</p>
    </footer>

    <canvas id="capture-canvas" style="display: none;"></canvas>
    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
